[project]
name = "budgetrag"
version = "0.1.0"
description = "BudgetRAG: reproducible retrieval and grounded question answering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "openai==1.51.0",
    # OpenAI 1.51 uses the proxies argument removed in httpx 0.28.
    "httpx==0.27.2",
    # Keep the original PostgreSQL runtime until its replacement is verified.
    "sqlalchemy==2.0.35",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.4",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-multipart==0.0.12",
    "pypdf==5.0.1",
    "tiktoken==0.8.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-socket==0.7.0",
    "ruff==0.9.10",
    "pyright==1.1.396",
]

[tool.uv]
package = false
required-version = "==0.12.16"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
